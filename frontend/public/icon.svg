<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a4d"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#2f6df0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f62d9"/>
      <stop offset="1" stop-color="#1b3a8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="212" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="212" fill="url(#glow)"/>
  <!-- the box: a container seen from its corner, its lid still glowing from the forge -->
  <path d="M252 382 L512 532 L512 824 L252 674 Z" fill="url(#left)"/>
  <path d="M772 382 L512 532 L512 824 L772 674 Z" fill="url(#right)"/>
  <path d="M512 232 L772 382 L512 532 L252 382 Z" fill="url(#top)"/>
  <!-- the ribs of a shipping container -->
  <g stroke="#0b1020" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round">
    <path d="M317 440 V690"/><path d="M382 478 V728"/><path d="M447 515 V765"/>
    <path d="M577 515 V765"/><path d="M642 478 V728"/><path d="M707 440 V690"/>
  </g>
  <path d="M512 232 L772 382 L512 532 L252 382 Z" fill="none" stroke="#fff3d6" stroke-opacity="0.55" stroke-width="8" stroke-linejoin="round"/>
  <!-- sparks -->
  <g fill="#ffd27a">
    <path d="M512 118 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/>
    <path d="M664 176 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" opacity="0.85"/>
    <path d="M372 190 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z" opacity="0.7"/>
