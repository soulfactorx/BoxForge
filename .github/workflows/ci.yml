name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./internal/... ./cmd/... ./frontend
          go test ./internal/...
      - name: Compile for Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/boxforge.exe .

  # The screens, in a browser, against the runner's real Docker engine.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Browser
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test the screens
        working-directory: e2e
        run: npx playwright test --trace off
      - name: Screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/test-results
          retention-days: 7
