# Publishes a release whenever main carries a version (wails.json,
# info.productVersion) that has not been released yet: it builds the
# programs, tags the commit v<version> and creates the GitHub release.
# So releasing is: raise the version, write its section in CHANGELOG.md,
# push to main.
#
# The app updates itself from these releases, so the file names
# (BoxForge-<os>-<arch>[.exe], BoxForge-darwin-universal, checksums.txt)
# are part of its contract: see internal/update.
#
# Signing is optional. With the repository secrets WINDOWS_CERTIFICATE (a
# .pfx file, base64) and WINDOWS_CERTIFICATE_PASSWORD the Windows program
# is signed; without them it is published unsigned.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.17.1

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .info.productVersion wails.json)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "wails.json's info.productVersion ($version) is not a version like 1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! grep -Eq "^## $version( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version: write one, it is the release's text." >&2
            exit 1
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            output: BoxForge-windows-amd64.exe
            tags: ""
          - os: ubuntu-24.04
            output: BoxForge-linux-amd64
            tags: webkit2_41
          - os: macos-latest
            output: BoxForge-darwin-universal
            tags: ""
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Test
        if: runner.os == 'Linux'
        run: |
          (cd frontend && npm ci && npm run build)
          test -z "$(gofmt -l .)"
          go vet ./internal/... ./cmd/...
          go test ./internal/...
      - name: Build
        shell: bash
        run: |
          args=(-clean -ldflags "-X github.com/soulfactorx/boxforge/internal/version.Version=${{ needs.plan.outputs.version }}")
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          if [ "${{ runner.os }}" = macOS ]; then
            args+=(-platform darwin/universal)
          else
            args+=(-o "${{ matrix.output }}")
          fi
          wails build "${args[@]}"
          ls -l build/bin
          mkdir out
          if [ "${{ runner.os }}" = macOS ]; then
            # The app for people to download, and the program inside it for
            # the app to update itself with. Signed ad hoc: Apple chips run
            # nothing unsigned.
            app="$(ls -d build/bin/*.app | head -1)"
            codesign --force --deep --sign - "$app"
            cp "$(ls "$app"/Contents/MacOS/* | head -1)" "out/${{ matrix.output }}"
            ditto -c -k --keepParent "$app" out/BoxForge-macos.zip
          else
            mv "build/bin/${{ matrix.output }}" out/
          fi
          ls -l out
      - name: Sign (Windows, when a certificate is configured)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem out\*.exe).FullName
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          (cd dist && sha256sum BoxForge-* > checksums.txt && cat checksums.txt)
          # This version's section of the changelog is the release's text.
          awk -v v="${{ needs.plan.outputs.version }}" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.plan.outputs.version }}"
          gh release create "v$version" dist/BoxForge-* dist/checksums.txt \
            --target "$GITHUB_SHA" --title "BoxForge $version" --notes-file notes.md
